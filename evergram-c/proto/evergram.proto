syntax = "proto3";

package evergram;

// Mensagens de Handshake
message ClientHello {
    string version = 1;
    bytes ephemeral_public_key = 2;
    bytes nonce = 3;
    string device_id = 4;
    string wallet_address = 5;
    bytes signature = 6;
}

message ServerHello {
    bytes server_public_key = 1;
    bytes nonce = 2;
    string session_id = 3;
    bool success = 4;
    string error_message = 5;
}

// Tipos de Mensagem
enum MessageType {
    UNKNOWN = 0;
    TEXT_MESSAGE = 1;
    REACTION = 2;
    TYPING_INDICATOR = 3;
    SYSTEM_EVENT = 4;
}

// Estrutura de Mensagem de Chat
message ChatMessage {
    string chat_id = 1;
    string sender_id = 2;
    string content = 3;
    int64 timestamp = 4;
    MessageType type = 5;
    string reply_to = 6;
}

// Reação
message Reaction {
    string chat_id = 1;
    string message_id = 2;
    string emoji = 3;
    bool add = 4;
}

// Indicador de Digitação
message TypingIndicator {
    string chat_id = 1;
    bool is_typing = 2;
}

// Evento do Sistema
message SystemEvent {
    string event_type = 1;
    string data = 2;
}

// Wrapper principal para transporte
message Envelope {
    oneof payload {
        ClientHello client_hello = 1;
        ServerHello server_hello = 2;
        ChatMessage chat_message = 3;
        Reaction reaction = 4;
        TypingIndicator typing = 5;
        SystemEvent system_event = 6;
    }
    bytes nonce = 7;
    bytes mac = 8;
}

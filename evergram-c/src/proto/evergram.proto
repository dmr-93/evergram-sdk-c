message CreateChat {
  required string type              = 1; // "one-on-one" | "group"
  repeated string             participants      = 2;
  required Meta meta              = 3;
  required Device device            = 4;
  map<string, AccountSymKeys> sym_key_encrypted = 5;
}

message Meta {
  message Roles {
    repeated string admins     = 1;
    repeated string moderators = 2;
    repeated string banned     = 3;
  }

  message Modes {
    required bool moderated         = 1;
    required bool invite_enabled    = 2;
    required string invite_code       = 3;
    required int64 invite_expires_at = 4; // 0 = never expires
    required int32 invite_max_uses   = 5; // 0 = unlimited
    required int32 invite_use_count  = 6;
    required bool discoverable      = 7;
    required string category          = 8; // one of a fixed server-side allowlist; set only when discoverable
  }

  required string name  = 1;
  required Roles roles = 2;
  required Modes modes = 3;
}

message CreateChatResponse {
  required ChatInfo chat   = 1;
  required ResponseStatus status = 2;

  // Group creation only: invitees skipped because they require chat
  // approval — a PendingGroupInvite was queued for each instead of adding
  // them to chat.participants immediately.
  repeated string pending_invitees = 3;
}

message ChatInfo {
  required string type         = 1; // "one-on-one" | "group"
  required int64 chat_version = 2;
  repeated string participants = 3;
   required Meta meta         = 4;
  required string chat_id      = 5;
  required string created_by   = 6;
  required int64 created_at   = 7;

  map<string, AccountSymKeys> sym_key_encrypted = 8;

  repeated string pending_join_requests = 9;

  // Raw epoch numbers, not a precomputed boolean — a boolean can't express
  // "how far behind", these can. needsRekey = current_key_epoch <
  // required_key_epoch is derived client-side. See contract's
  // handleGetChat/queryChats and the device-revocation design doc.
  required uint64 current_key_epoch  = 10;
  required uint64 required_key_epoch = 11;

  // Bumped by metadata-only mutations (moderation toggle, invite link,
  // discoverable, requestJoin, leaveChat) that don't touch sym_key_encrypted.
  // Kept separate from chat_version so those mutations never trigger a
  // spurious key-rotation prompt on devices that already hold the current key.
  required int64 meta_version = 12;
}

message AccountSymKeys {
  // deviceId -> SymKeyEncrypted
  map<string, SymKeyEncrypted> devices = 1;
}

// Sent by the recipient of a pending chat request to accept it and

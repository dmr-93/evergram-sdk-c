message RotateChatVersion {
  required string chat_id           = 1;
  required string account           = 2;
  map<string, AccountSymKeys> sym_key_encrypted = 3;
  // The caller's last-known chat_version. The contract rejects a stale value
  // with "rotation_conflict" instead of silently overwriting a concurrent
  // rotation's key.
  required uint64 expected_version  = 4;
}

message RotateChatVersionResponse {
  required ResponseStatus status = 1;
  required ChatInfo chat   = 4;
}

message Envelope {
  required string type         = 1; // "SEND", "ACK", "TYPING", "DELIVERY", "REACT", "EDIT"
  required Device device       = 2;
  required string chat_id      = 3;
  required string sender       = 4; // sender identity key
  repeated string participants = 5;
  required int64 ts           = 6;

  oneof content {
    SendContent           send     = 7;
    TypingContent         typing   = 8;
    AckContent            ack      = 9;
    DeliveryStatusContent delivery = 10;
    ReactContent          react    = 11;
    EditContent           edit     = 12;
  }
}

message SendContent {
  required string msg_id          = 1;
  required string ciphertext      = 2;
  required string nonce           = 3;
  required string reply_to_msg_id = 4; // plaintext ref to the message being replied to, like ReactContent/EditContent.msg_id; empty = not a reply
}

message TypingContent {
  required bool is_typing = 1;
}

message AckContent {
  required string event_type     = 1; // SEND, TYPING, DELIVERY, REACT, EDIT
  required string related_msg_id = 2;
}

message DeliveryStatusContent {
  required string msg_id     = 1;
  required ResponseStatus status     = 2;
  required int64 ts         = 3;
  // "SEND" (default/empty = legacy SEND), "REACT", "EDIT" — lets the client
  // tell "the original message failed to send" apart from "a later
  // react/edit/delete attempt on it was rejected", which need very
  // different UI handling (the former marks the message failed; the
  // latter must NOT touch the original message's delivery status at all).
  required string event_type = 4;
}

message ReactContent {
  required string msg_id     = 1; // target message being reacted to (plaintext ref, like AckContent.related_msg_id)
  required string ciphertext = 2; // encrypted emoji (same encryptMessage/decryptMessage as SendContent)
  required string nonce      = 3;
  required bool removed    = 4; // true = remove my reaction from this message
}

// Covers both "edit" and "delete for everyone" — delete is just an edit with
// removed=true and an empty/ignored ciphertext. Reuses the same transport,
// authorization (recentSends ownership+window check) and fan-out as edit;
// only the client-side rendering differs (tombstone vs. new text).
message EditContent {
  required string msg_id     = 1; // target message being edited or removed
  required string ciphertext = 2; // new encrypted body; ignored when removed=true
  required string nonce      = 3;
  required int64 edited_at  = 4;
  required bool removed    = 5; // true = "delete for everyone" tombstone
}

message Device {
  required string device_id      = 1;
  required string device_pub_hex = 2;

  // Populated only in device-listing responses (RegisterDeviceResponse.devices,
  // ListDevicesResponse.devices) — empty/zero on every other use of this
  // message (Envelope.device, Auth.device, etc.), which always describe the
  // calling connection's own current device.
  required string status            = 3; // "registered" | "revoked"
  required int64 revoked_at        = 4;
  required uint64 revocation_epoch  = 5;
  required int64 last_seen_at      = 6;

  // platform: client self-declared (e.g. "Chrome · Ubuntu", "Terminal").
  // Input on Auth/RegisterDevice.device; echoed back on every response.
  required string platform = 7;

  // Gateway-computed from its live WebSocket connection registry — never
  // persisted/consensus-derived, so it reflects only this gateway node's own
  // connections and is stamped in after the contract response comes back
  // (see contractResponse.ts). Populated only in device-listing responses,
  // same scope as status/revoked_at/revocation_epoch/last_seen_at above.
  required bool is_online = 8;
}

message RegisterDevice {
  required ChainIdentity identity = 1;
  required Device device   = 2;
  required AuthProof proof    = 3;
}

message RegisterDeviceResponse {
  required ResponseStatus status           = 1;
  required string account          = 2;
  required string device_id        = 3;
  repeated Device   devices          = 4;
  repeated ChatInfo rotated_sym_keys = 5;
}


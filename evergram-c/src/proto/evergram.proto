syntax = "proto2";

package evergram;

enum ChainFamily {
  CHAIN_FAMILY_UNSPECIFIED = 0;
  XRPL                     = 1;
  EVM                      = 2;
  BTC                      = 3;
  SOL                      = 4;
}

message ChainIdentity {
  required ChainFamily chain_family = 1;
  required string address      = 2; // rAddress, 0x..., etc
   required string network_id   = 3;
}

// AuthProof is only valid during bootstrap or sensitive operations.
// It must NOT be persisted or propagated beyond session boundaries.
message AuthProof {
  oneof proof {
    string             jwt            = 1;
    SignedMessageProof signed_message = 2;
    bytes              hp_challenge   = 3;
  }
}

// Direct wallet-signature proof (e.g. XRPL), used by headless/programmatic
// clients (bots, SDK) that have no Xaman session to obtain a jwt from.
// The signed challenge is "evergram-auth:{address}:{deviceId}:{nonce}",
// where nonce is the one delivered via AuthChallenge for this connection
// (see ServerMessage.auth_challenge) — single-use, never reused across
// connections. The gateway verifies signature_hex against public_key_hex,
// then confirms the derived address matches ChainIdentity.address.
message SignedMessageProof {
  required string public_key_hex = 1;
  required string signature_hex  = 2;
}

// Pushed by the gateway immediately on connection open, before any client
// message — the nonce a signed_message proof must include in its challenge
// for THIS connection. Single-use: consumed on the first auth attempt
// (success or failure); a new connection always gets a fresh one. Ignored
// by clients using the jwt proof path.
message AuthChallenge {
  required string nonce = 1;
}

/* message BootstrapAuthRequest {
 required ChainIdentity identity   = 1;
 required AuthProof proof      = 2;
 required string device_id  = 3;
 required bytes device_pub = 4;
 } */

message DeviceForceRefresh {

}

message DeviceForceRefreshResponse {
  required ResponseStatus status = 1;
}

message ClientMessage {
  // Client-generated, gateway-echoed correlation id for this request's
  // response (see ServerMessage.request_id). Purely a browser/SDK<->gateway
  // concern — stripped before the payload is forwarded to the contract, so
  // it carries no consensus/determinism weight. 0 means "not set" (senders
  // must count from 1) — older clients that predate this field send 0,
  // which the gateway never echoes, so those connections fall back to the
  // pre-existing per-field response matchers.
   required uint32 request_id = 1;

  oneof payload {
    Auth                 auth            = 2;
    CreateChat           create_chat     = 3;
    RegisterDevice       register_device = 4;
    GetProfile           get_profile     = 5;
    QueryChats           query_chats     = 6;
    Envelope             envelope        = 7; // events: SEND, TYPING, ACK, DELIVERY ...
    PingPong             ping            = 8;
    ChangeProfileRequest change_profile  = 9;

    GrantBetaAccess  grant_beta_access = 10;
    InitiatePurchase initiate_purchase = 11;
    ClaimPro         claim_pro         = 12;
    VerifyPurchase   verify_purchase   = 13;

    WatchIdentities   watch_identities   = 14;
    UnwatchIdentities unwatch_identities = 15;

    Envelope relay_message_envelope = 16;

    RotateChatVersion rotate_chat_version = 17;
    ClaimBetaAccess   claim_beta_access   = 18;

    LeaveChat  leave_chat  = 19;
    ReportUser report_user = 20;

    AddParticipantRequest    add_participant    = 21;
    RemoveParticipantRequest remove_participant = 22;
    SetChatMode              set_chat_mode      = 23;
    UpdateChatRoles          update_chat_roles  = 24;
    DeviceForceRefresh       device_force_refresh = 25;
    UpgradeContract          upgrade_contract     = 26;
    GetMetrics               get_metrics          = 27;

    GenerateInviteLink generate_invite_link = 28;
    RevokeInviteLink   revoke_invite_link   = 29;
    ResolveInvite      resolve_invite       = 30;
    RequestJoin        request_join         = 31;

    SetChatDiscoverable set_chat_discoverable = 32;
    ListPublicChats     list_public_chats     = 33;

    UpdatePrivacySettings update_privacy_settings = 34;
    AcceptChatRequest     accept_chat_request     = 35;
    BlockIdentity         block_identity          = 36;
    UnblockIdentity       unblock_identity        = 37;
    CheckBlocked          check_blocked           = 38;

    AcceptGroupInvite  accept_group_invite  = 39;
    DeclineGroupInvite decline_group_invite = 40;

    CreateEphemeralRoom create_ephemeral_room = 41;
    RelayMessage        relay_message         = 42;

    CreateWidget create_widget = 43;
    DeleteWidget delete_widget = 44;
    UpdateWidget update_widget = 45;
    ListWidgets  list_widgets  = 46;
    GetWidgetInfo get_widget_info = 47;

    CreateVisitorRoom create_visitor_room = 48;

    RevokeDevice revoke_device = 49;
    ListDevices  list_devices  = 50;

    DenyJoinRequest deny_join_request = 51;

    SyncHistoryRequest  sync_history_request  = 52;
    SyncHistoryFetch    sync_history_fetch    = 53;
    SyncHistoryAccept   sync_history_accept   = 54;
    SyncHistoryReject   sync_history_reject   = 55;
    SyncHistoryChunk    sync_history_chunk    = 56;
    SyncHistoryDone     sync_history_done     = 57;

    UpdateWidgetConfig update_widget_config = 58;

    SubscribePublicChannel subscribe_public_channel = 59;

    ModerateChannel moderate_channel = 60;

    DeclineChatRequest    decline_chat_request     = 61;
    ListBlockedIdentities list_blocked_identities   = 62;

    CheckIdentityRegistered check_identity_registered = 63;
  }
}

message SubscribePublicChannel {
  required string widget_id   = 1;
  required string channel_key = 2; // 64-char hex, from operator's local widgetConfig
}

message SubscribePublicChannelResponse {
  required ResponseStatus status      = 1;
  required string room_token  = 2;
  required string channel_key = 3;
  // Nicknames already known for this channel's other live subscribers (see
  // publicChannelRegistry.ts's getChannelParticipantNames) — lets the
  // caller seed its participants list without waiting for each of them to
  // send anything. Never includes the caller itself.
  repeated string participants = 4;
  // Current moderation state (see publicChannelRegistry.ts's
  // ModerationSnapshot) — without this, a (re)joining/reconnecting client
  // has no way to know who's op/voiced or whether the channel is
  // moderated until the next live ModerateChannel action broadcasts one;
  // after a reload it would otherwise silently reset to nothing/false.
  required bool moderated = 5;
  repeated string ops       = 6;
  repeated string voiced    = 7;
  // Echoes the widgetId that was subscribed to, so a caller with several
  // subscribePublicChannel() calls in flight at once (e.g. an operator bot
  // managing multiple widgets) can match a response back to the right
  // request instead of matching whichever resolves first.
  required string widget_id = 8;
}

// IRC-style moderation for a public_group channel (see
// publicChannelRegistry.ts). Every action shares the same auth check (caller
// must currently be op — see isChannelOp) and the same request/target shape,
// so this is one combined RPC rather than a message per action.
enum ModerationAction {
  MODERATION_KICK           = 0;
  MODERATION_BAN            = 1;
  MODERATION_UNBAN          = 2;
  MODERATION_GRANT_OP       = 3;
  MODERATION_REVOKE_OP      = 4;
  MODERATION_GRANT_VOICE    = 5;
  MODERATION_REVOKE_VOICE   = 6;
  MODERATION_SET_MODERATED  = 7;
  MODERATION_UNSET_MODERATED = 8;
}

message ModerateChannel {
  required string room_token        = 1;
  required ModerationAction action            = 2;
  // Required for KICK/BAN/UNBAN/GRANT_OP/REVOKE_OP/GRANT_VOICE/REVOKE_VOICE
  // (resolved to a live subscriber by current nickname — see
  // findSubscriberWsByName); ignored for SET_MODERATED/UNSET_MODERATED.
  required string target_participant = 3;
}

message ModerateChannelResponse {
  required ResponseStatus status     = 1;
  required string room_token = 2;
  required bool moderated  = 3;
  repeated string ops        = 4;
  repeated string voiced     = 5;
}

// Anonymous ephemeral side-chat ("magic link"): the link creator is an
// authenticated identity (this message goes through the normal auth gate +
// rate limiting below), but the joiner who opens the link is never
// authenticated — see RelayMessage, which IS exempted from auth, and is the
// only thing the anonymous side ever sends.
//
// The gateway relays RelayMessage as an opaque blob between the two sockets
// paired on room_token — it never reaches HotPocket/consensus, and the
// gateway never sees plaintext: payload is nacl.secretbox ciphertext keyed
// by a secret that lives only in the link's URL fragment, which browsers
// never send to any server. This was originally a WebRTC P2P data channel
// with the gateway only relaying SDP/ICE signaling; that needs a TURN relay
// to work across arbitrary NATs (STUN alone isn't enough — confirmed by
// hand, not just in theory), which is new infra/cost this feature was
// explicitly trying to avoid. Relaying the actual (still E2E-encrypted)
// chat content through the same gateway sidesteps NAT traversal entirely
// and is also just consistent with how the rest of Evergram's chat already
// works (sender -> gateway -> recipient, never P2P).
message CreateEphemeralRoom {
}

message CreateEphemeralRoomResponse {
  required ResponseStatus status     = 1;
  required string room_token = 2;
}

enum RelayMessageKind {
  // Sent by the anonymous joiner as its first frame for a room_token —
  // both claims the room's single joiner slot and tells the gateway to
  // relay it (and only it) to the creator from then on. The creator
  // receiving this relayed is its cue to flip to "connected" in the UI.
  RELAY_JOINED = 0;
  // Content-bearing kinds — payload is always {nonce, ciphertext} JSON
  // from nacl.secretbox, opaque to the gateway. The plaintext underneath
  // is itself a small JSON envelope ({msgId, sender, text, ...}) so both
  // sides can track which message a react/edit/remove targets without the
  // gateway ever needing to know (it just relays the kind + opaque blob,
  // same as it already does for TEXT — see relayMessage.ts).
  RELAY_TEXT   = 1;
  RELAY_REACT  = 3;
  RELAY_EDIT   = 4;
  RELAY_REMOVE = 5;
  // Gateway-synthesized (never sent by a client) when one side's socket
  // closes, so the remaining side's UI isn't left guessing — see
  // ephemeralRoomRegistry.ts. Its payload, when non-empty, is plaintext
  // JSON ({deadlineAt}) carrying the reconnect grace window's deadline,
  // not encrypted content.
  RELAY_LEFT   = 2;
  // Sent by a previously-paired side reconnecting after a drop (e.g. a
  // page reload), reusing the same room_token instead of minting a new
  // one. Only succeeds against a `reclaimable` room (see
  // ephemeralRoomRegistry.ts's reclaimCreatorSlot) within its reconnect
  // grace window.
  RELAY_RECLAIM = 6;
  // Sent by either side currently holding a slot in the room (the widget
  // owner or the visitor) to deliberately and permanently close it —
  // unlike RELAY_LEFT this is not a drop that can be reconnected from;
  // the room is deleted outright (see ephemeralRoomRegistry.ts's
  // endRoom).
  RELAY_END = 7;
  // Gateway-synthesized (never sent by a client), like RELAY_LEFT — but
  // sent only to the one socket whose own RELAY_JOINED/RELAY_RECLAIM just
  // lost a race against another socket that already holds that slot live.
  // Distinct from "the room is over": the room is fine, just claimed by
  // someone else (the widget-visitor flow pushes VisitorRoomRequestedEvent
  // to every device of the owner, but only the first to claim the room
  // actually gets it — see relayMessage.ts/ephemeralRoomRegistry.ts). Tells
  // that one socket to give up locally instead of silently sitting in a
  // session it was never actually paired into.
  RELAY_CLAIMED_ELSEWHERE = 8;
  // Sent by either side currently holding a slot in the room, mirroring
  // TypingContent on the real per-chat Envelope (see handleTyping.ts on the
  // gateway) — plaintext payload, JSON {isTyping: bool, sender?: string},
  // not nacl-encrypted like the content kinds above: typing liveness isn't
  // message content, and the real chat already accepts the gateway seeing
  // it in the clear. `sender` is public_group-only (a channel has more than
  // one other party to attribute the signal to); 1:1 rooms omit it. Relayed
  // through the exact same opaque kind+payload path as every other frame
  // (see relayMessage.ts) — no gateway changes needed to support it.
  RELAY_TYPING = 9;
  // public_group-only presence, deliberately distinct from RELAY_JOINED/
  // RELAY_LEFT: those two pair/unpair a 1:1 room's single peer and flip
  // EphemeralRelaySession's connectionStatus (open/peer_left) — reusing
  // them for a shared channel would wrongly flip the whole channel to
  // "peer_left" every time any one of N participants disconnects. Sent by
  // a visitor's client right after joining a channel; payload is plaintext
  // JSON {sender}, like RELAY_TYPING — presence, not message content — so
  // the gateway may read (but never modify) it to learn the connection's
  // nickname for publicChannelRegistry.ts's participant tracking.
  RELAY_CHANNEL_JOIN = 10;
  // Gateway-synthesized (never sent by a client), mirroring RELAY_LEFT's
  // "gateway announces a drop" pattern but scoped to one participant of a
  // shared channel rather than a 1:1 room's only peer. Plaintext payload
  // {sender}, same shape as RELAY_CHANNEL_JOIN.
  RELAY_CHANNEL_PART = 11;
  // Gateway-synthesized (never sent by a client), targeted at exactly the
  // ejected connection only (not broadcast) — sent right before the
  // gateway closes that socket in response to a ModerateChannel KICK or
  // BAN action (see moderateChannel.ts). Plaintext payload {reason:
  // "kicked"|"banned"}; the client treats this like RELAY_END/
  // RELAY_CLAIMED_ELSEWHERE — final, no reconnect.
  RELAY_CHANNEL_KICKED = 12;
  // Gateway-synthesized (never sent by a client), broadcast to every
  // remaining channel subscriber after any ModerateChannel action
  // succeeds — plaintext payload is a fresh state snapshot, {moderated:
  // bool, ops: string[], voiced: string[]} (participant names, same
  // identity model as RELAY_CHANNEL_JOIN — presence, not content).
  RELAY_CHANNEL_MODE = 13;
}

message RelayMessage {
  required string room_token = 1;
  required RelayMessageKind kind       = 2;
  required bytes payload    = 3;
}

// Embeddable chat widget: a Widget is a revocable, opaque public
// identifier (widget_id) that resolves to an owning identity + its
// devices, so an anonymous website visitor can reach that identity
// without ever seeing or addressing it directly. owner_identity_key is
// fixed at creation — there is no transfer-ownership operation. Deleting
// a widget is a soft delete (the `deleted` flag): widget_id is retired
// forever, never reissued, and the owner's ListWidgets history is kept.
message Widget {
  required string widget_id      = 1;
  required string name           = 2;
  required bool enabled        = 3;
  required bool deleted        = 4;
  required int64 widget_version = 5;
  required int64 created_at     = 6;
  required WidgetConfig config   = 7; // present when the owner's own ListWidgets response includes stored config (e.g. for public_group key recovery)
}

message CreateWidget {
  required string name = 1;
}

message CreateWidgetResponse {
  required ResponseStatus status = 1;
  required Widget widget = 2;
}

message DeleteWidget {
  required string widget_id = 1;
}

message DeleteWidgetResponse {
  required ResponseStatus status    = 1;
  required string widget_id = 2;
}

message UpdateWidget {
  required string widget_id = 1;
   required bool enabled   = 2;
}

message UpdateWidgetResponse {
  required ResponseStatus status = 1;
  required Widget widget = 2;
}

message ListWidgets {
}

message ListWidgetsResponse {
  required ResponseStatus status  = 1;
  repeated Widget widgets = 2;
}

// The ONLY message in this protocol answerable with no `authorization` at
// all — the gateway calls this on behalf of an anonymous widget visitor
// who has no session. Must never act as an existence/enumeration oracle:
// an unknown, disabled, or deleted widget_id all return the exact same
// { enabled: false, devices: [] } shape. owner_identity_key is consumed
// only by the gateway internally (to find live device sockets and seal
// the room key) — it is never relayed onward to the visitor.
message GetWidgetInfo {
  required string widget_id = 1;
}

message GetWidgetInfoResponse {
  required ResponseStatus status             = 1;
  required bool enabled            = 2;
  required string owner_identity_key = 3;
  repeated Device devices            = 4;
  required WidgetConfig config             = 5;
  // Echoes the widgetId that was queried, so a caller with several
  // getWidgetInfo() calls in flight at once can match a response back to
  // the right request instead of matching whichever resolves first.
  required string widget_id          = 6;
}

// Anonymous visitor -> gateway: addresses a widget, never an identity
// directly. sym_key is generated client-side by the visitor; the gateway
// sees it in plaintext for only as long as it takes to seal it per-device
// via encryptSymKeyForDevices (the same thing it already does for normal
// chat key distribution — this is not a new exception to any rule).
// first_message_payload is the visitor's first message, already encrypted
// with sym_key in the same envelope shape as a normal RELAY_TEXT payload —
// the gateway only ever carries it, never decrypts it. No room is created
// just by opening the widget; this message (and the room it creates) only
// ever exists because the visitor actually sent something.
message CreateVisitorRoom {
  required string widget_id             = 1;
  required bytes sym_key                = 2;
  required string visitor_label         = 3;
  required bytes first_message_payload = 4;
}

message WidgetConfig {
  required string primary_color     = 1;
  required string logo_url          = 2;
  required string welcome_message   = 3;
  required string input_placeholder = 4;
  required string agent_name        = 5;
  required string position          = 6; // "bottom-right" | "bottom-left"
  required string mode              = 7; // "private_chat" | "public_group"
  required string channel_key       = 8; // 64-char hex (32 bytes); only present in public_group
}

message UpdateWidgetConfig {
  required string widget_id = 1;
  required WidgetConfig config    = 2;
}

message UpdateWidgetConfigResponse {
  required ResponseStatus status    = 1;
  // Echoes the widgetId that was updated, so a caller with several
  // updateWidgetConfig() calls in flight at once can match a response back
  // to the right request instead of matching whichever resolves first.
  required string widget_id = 2;
}

message CreateVisitorRoomResponse {
  required ResponseStatus status     = 1;
  required string room_token = 2;
  required WidgetConfig config     = 3;
  // public_group only — see SubscribePublicChannelResponse.participants.
  // Always empty for private_chat.
  repeated string participants = 4;
  // public_group only — see SubscribePublicChannelResponse.moderated/
  // ops/voiced. Always false/empty for private_chat.
  required bool moderated = 5;
  repeated string ops       = 6;
  repeated string voiced    = 7;
}

// Server -> client push, sent to every open device socket of the widget's
// resolved owner. sealed_key_by_device carries one sealed copy of sym_key
// per device (each device decrypts with its own private key); widget_id
// lets the owner's UI show which widget the conversation came in on
// without duplicating its name into every event.
message SealedKeyForDevice {
  required string ciphertext       = 1;
  required string nonce            = 2;
  required string ephemeral_pubkey = 3;
}

message VisitorRoomRequestedEvent {
  required string room_token            = 1;
  required string widget_id              = 2;
  required string visitor_label          = 3;
  required string origin                 = 4;
  required int64 ts                     = 5;
  map<string, SealedKeyForDevice>  sealed_key_by_device   = 6;
  required bytes first_message_payload  = 7;
}

// Pushed to the visitor if a room they created is never claimed (the
// owner had a device online at creation time but it disconnected before
// joining — the common "owner offline" case is rejected synchronously,
// before any room exists, so this only covers that rarer race).
message VisitorRoomTimedOutEvent {
  required string room_token = 1;
}

message SetChatMode {
  required string chat_id   = 1;
  required bool moderated = 2;
}

message SetChatModeResponse {
  required ResponseStatus status = 1;

  required string chat_id      = 2;
  required uint64 chat_version = 3;
}

message ClaimBetaAccess {

}
message ClaimBetaAccessResponse {
  required ResponseStatus status = 1;
  required int64 ts     = 2;
}

message AddParticipantRequest {
  required string chat_id           = 1;
  required string remote_identity   = 2;
  map<string, AccountSymKeys> sym_key_encrypted = 3;
  // The caller's last-known chat_version, same role as RotateChatVersion's
  // field of the same name: the contract rejects a stale value with a
  // conflict code instead of letting this write's symKeyEncrypted silently
  // clobber a concurrent membership change's.
  required uint64 expected_version  = 4;
}

message RemoveParticipantRequest {
  required string chat_id           = 1;
  required string remote_identity   = 2;
  map<string, AccountSymKeys> sym_key_encrypted = 3;
  // See AddParticipantRequest.expected_version.
  required uint64 expected_version  = 4;
}

message AddParticipantResponse {
  required ResponseStatus status = 1;

  required string chat_id         = 2;
  required string remote_identity = 3;

  required uint64 chat_version = 4;
}

message RemoveParticipantResponse {
  required ResponseStatus status = 1;

  required string chat_id         = 2;
  required string remote_identity = 3;

  required uint64 chat_version = 4;
}

message GenerateInviteLink {
  required string chat_id    = 1;
   required int64 expires_at = 2; // unix ms, 0/unset = never expires
   required int32 max_uses   = 3; // 0/unset = unlimited
}

message GenerateInviteLinkResponse {
  required ResponseStatus status       = 1;
  required string chat_id      = 2;
  required string invite_code  = 3;
  required uint64 chat_version = 4;
}

message RevokeInviteLink {
  required string chat_id = 1;
}

message RevokeInviteLinkResponse {
  required ResponseStatus status       = 1;
  required string chat_id      = 2;
  required uint64 chat_version = 3;
}

message ResolveInvite {
  required string invite_code = 1;
}

message ResolveInviteResponse {
  required ResponseStatus status            = 1;
  required string chat_id           = 2;
  required string name              = 3;
  required int32 member_count      = 4;
  required bool already_member    = 5;
  required bool already_requested = 6;
  // Echoes the invite code that was resolved, so a caller with several
  // resolveInvite() calls in flight at once can match a response back to
  // the right request instead of matching whichever resolves first.
  required string invite_code       = 7;
}

message RequestJoin {
  required string invite_code = 1;
}

message RequestJoinResponse {
  required ResponseStatus status            = 1;
  required string chat_id           = 2;
  required bool already_member    = 3;
  required bool already_requested = 4;
  required string name              = 5;
  repeated string admins            = 6;
  repeated string moderators        = 7;
  // Echoes the invite code that was requested — same rationale as
  // ResolveInviteResponse.invite_code above.
  required string invite_code       = 8;
}

message DenyJoinRequest {
  required string chat_id        = 1;
  required string remote_identity = 2;
}

message DenyJoinResponse {
  required ResponseStatus status          = 1;
  required string chat_id         = 2;
  required string remote_identity = 3;
  required string name            = 4; // group name, for the requester notification
}

// Server -> client push, sent to a group's admins/moderators when someone
// requests to join via invite link.
message JoinRequestedEvent {
  required string chat_id  = 1;
  required string identity = 2;
  required string name     = 3; // group name, for notification copy
  required int64 ts       = 4;
}

// Server -> client push, sent to the requester when an admin/moderator denies
// their join request.
message JoinDeniedEvent {
  required string chat_id = 1;
  required string name    = 2; // group name, for notification copy
}

message SetChatDiscoverable {
  required string chat_id      = 1;
  required bool discoverable = 2;
  required string category     = 3; // required when discoverable=true; ignored otherwise
}

message SetChatDiscoverableResponse {
  required ResponseStatus status       = 1;
  required string chat_id      = 2;
  required bool discoverable = 3;
  required string category     = 4;
  required uint64 chat_version = 5;
}

message ListPublicChats {
  required string category = 1; // empty = all categories
}

message PublicChatPreview {
  required string chat_id      = 1;
  required string name         = 2;
  required int32 member_count = 3;
  required string category     = 4;
  required string invite_code  = 5;
}

message ListPublicChatsResponse {
  required ResponseStatus status   = 1;
  repeated PublicChatPreview chats    = 2;
  // Echoes the category that was queried (empty = all categories), so a
  // caller with several listPublicChats() calls in flight for different
  // categories can match a response back to the right request.
  required string category = 3;
}

message ServerMessage {
  // Echoes ClientMessage.request_id for responses to a specific request
  // (0/absent for server-initiated pushes — envelope, presence, profile
  // updates, etc. — which aren't responses to any single request). See
  // ClientMessage.request_id for the full rationale.
   required uint32 request_id = 73;

  oneof payload {
    AuthResponse           auth_response            = 1;
    RegisterDeviceResponse register_device_response = 2;
    CreateChatResponse     create_chat_response     = 3;
    QueryChatsResponse     query_chats_response     = 5;
    Error                  error                    = 6;
    Envelope               envelope                 = 7; // events: SEND, TYPING, ACK, DELIVERY ...
    PingPong               pong                     = 8;
    ChangeProfileResponse  change_profile_response  = 9;
    ProfileUpdatedEvent    profile_updated          = 10;
    GetProfileResponse     get_profile_response     = 11;

    GrantBetaAccessResponse grant_beta_access_response = 12;

    InitiatePurchaseResponse initiate_purchase_response = 13;
    ClaimProResponse         claim_pro_response         = 14;
    VerifyPurchaseResponse   verify_purchase_response   = 15;

    AccountPresence      account_presence       = 16;
    AccountAccessUpdated account_access_updated = 17;

    GetDevicePublicKeysByIdentities get_device_public_keys_by_identities = 18;

    RotateChatVersionResponse rotate_chat_version_response = 19;
    ClaimBetaAccessResponse   claim_beta_access_response   = 20;

    LeaveChatResponse leave_chat_response = 21;

    ReputationUpdated  reputation_updated   = 22;
    ReportUserResponse report_user_response = 23;

    AddParticipantResponse    add_participant_response    = 24;
    RemoveParticipantResponse remove_participant_response = 25;
    SetChatModeResponse       set_chat_mode_response      = 26;

    UpdateChatRolesResponse update_chat_roles_response = 27;

    DeviceForceRefreshResponse device_force_refresh_response = 28;
    UpgradeContractResponse    upgrade_contract_response    = 29;
    MetricsResponse            metrics_response             = 30;

    GenerateInviteLinkResponse generate_invite_link_response = 31;
